{% extends "layout.html" %}

{% block title %}
{{ recipe.name }}
{% endblock %}


{% block content %}

{% if recipe %}

<div class="mb-3">

    <a
        href="/recipes/"
        class="btn btn-outline-secondary btn-sm">

        <i class="bi bi-arrow-left"></i>
        Назад

    </a>

</div>


<div class="card border-0 shadow">

    <div class="row g-0">

        <div class="col-md-6">

            <img
                src="{{ recipe.image }}"
                class="img-fluid rounded-start recipe-detail-image"
                alt="{{ recipe.name }}">

        </div>


        <div class="col-md-6">

            <div class="card-body p-5">

                <span class="badge bg-warning text-dark mb-3">
                    {{ recipe.country }}
                </span>

                <h1 class="card-title mb-4">
                    {{ recipe.name }}
                </h1>

                <p class="card-text fs-5 text-muted">
                    {{ recipe.description }}
                </p>


                <hr>


                <div class="mt-4">

                    <span class="text-muted">
                        Recipe ID:
                    </span>

                    <strong>
                        #{{ recipe.id }}
                    </strong>

                </div>

            </div>

        </div>

    </div>

</div>

{% else %}

<div class="alert alert-warning">
    Рецепт не знайдено.
</div>

{% endif %}

{% endblock %}
