{% load static %}

<!DOCTYPE html>
<html lang="uk">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>{% block title %}World Recipes{% endblock %}</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

    <link rel="stylesheet" href="{% static 'styles.css' %}">
    
</head>

<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">

        <a class="navbar-brand fw-bold" href="/recipes/">
            <i class="bi bi-egg-fried"></i>
            World Recipes
        </a>

        <button
            class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#navbarMenu">

            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarMenu">

            <ul class="navbar-nav ms-auto">

                <li class="nav-item">
                    <a class="nav-link" href="/recipes/">
                        Рецепти
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="/admin/">
                        Admin
                    </a>
                </li>

            </ul>

        </div>
    </div>
</nav>


<header class="hero-section text-white">
    <div class="container text-center py-5">

        <h1 class="display-3 fw-bold">
            World Recipes
        </h1>

        <p class="lead">
            Відкривай рецепти кухонь світу
        </p>

        <a href="/recipes/" class="btn btn-warning btn-lg mt-3">
            Переглянути рецепти
        </a>

    </div>
</header>


<main class="container pb-5">

    {% block content %}
    {% endblock %}

</main>


<footer class="border-top py-4">
    <div class="container text-center text-muted">

        <p class="mb-0">
            © 2026 World Recipes
        </p>

    </div>
</footer>


<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js">
</script>

</body>

</html>
